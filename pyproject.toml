[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-control-groups-ntp"
version = "0.1.0"
description = "Proof of concept: virtual control groups for NTP rodent toxicology studies, built from public CEBS historical control data"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Julia Kowalczuk" }]
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.2",
    "pandas==2.2.3",
    "pyarrow==25.0.1",
    "scipy==1.14.1",
    "statsmodels==0.14.4",
    "matplotlib==3.10.6",
    "openpyxl==3.1.5",
    "requests==2.32.5",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "jupyterlab==4.5.6", "nbconvert==7.17.0", "nbformat==5.10.4", "ipykernel==7.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
